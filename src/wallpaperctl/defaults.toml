# Default operation settings (override in ~/.config/wallpaperctl/ops.toml)

operations_enabled = true
continue_on_error = true
debug_operations = false

[enable]
wallust = true
xresources = true
gtk_theme = true
notifications = true
openrgb = true
openlinkhub = true
emacs = true
window_manager = true
nwg_look = true
cinnamon_theme = true
dynamic_icons = false
homeassistant = true
steam_theme = false
cosmic_theme = true
cde_theme = true
omarchy = true
browser_policy = true
pywalfox = true

[wallust]
# mapped via flat keys below for simplicity — use top-level too

[ops]
wallust_backend = "wal"
wallust_palette = "kmeans"
# Enforce WCAG contrast on the palette after wallust runs (wallust's own
# check_contrast is only a mild background-relative check). Terminal text
# slots get wallust_text_contrast, ANSI accents wallust_accent_contrast.
# Alternative: palette = "ansidark" + color_space = "lchansi" keeps TTY
# color order; or "harddark16" / "darkcomp16" schemes.
wallust_fix_contrast = true
wallust_text_contrast = 4.5
wallust_accent_contrast = 3.0
gtk_theme_plasma = "Breeze"
gtk_theme_xfce = "FlatColor-dark"
gtk_theme_cinnamon = "Mint-Y"
gtk_theme_standalone = "FlatColor-dark"
# Standalone WM GTK: tint stock Adwaita via user gtk.css (Omarchy-style), no
# vendored FlatColor needed. Set false to fall back to gtk_theme_standalone.
gtk_adwaita_tint = true
dynamic_icon_theme_name = "wallust-dynamic-icons"
rgb_color_strategy = "warmest"
openrgb_color_line_plasma = 3
openrgb_color_line_standalone = 5
# OpenLinkHub local REST (soft-skip if daemon not running)
openlinkhub_url = "http://127.0.0.1:27003"
openlinkhub_timeout = 5.0
openlinkhub_brightness = 1.0
emacs_theme = "ewal-doom-one"
wallpaper_scaling_cinnamon = "scaled"
wallpaper_scaling_gnome = "scaled"
wallpaper_dir = "~/Wallpapers"

# COSMIC theming (see theme/cosmic.py)
# cosmic_theme_mode = "surfaces"   # accent | surfaces | full
# cosmic_accent_strategy = "warmest"
# cosmic_accent_softness = 0.42    # mix accent toward wallpaper bg
# cosmic_accent_desaturate = 0.22

# Omarchy dynamic theme (see theme/omarchy.py)
# omarchy_theme_slug = "dynamic-wallpapers"   # displayed as "Dynamic Wallpapers"
# omarchy_accent_strategy = "warmest"         # palette strategy for colors.toml accent
# omarchy_timeout = 60                        # omarchy theme refresh budget (seconds; runner adds slack)
# omarchy_refresh_apps = true                 # false = stage colors.toml only, no app retint
# omarchy_refresh_browser = true              # false = leave browser chrome to manual theme switches
# omarchy_refresh_opencode = true             # false = leave opencode theme to manual theme switches

# Chromium-family browser tint via managed policies (see theme/browser.py)
# browser_color_scheme = "dark"               # dark | light | device
# omarchy_skip_unchanged = true               # skip refresh when palette is unchanged

# Pywalfox (Firefox) — boost colors.json contrast then pywalfox update
# pywalfox_improve_contrast = true
# pywalfox_text_contrast = 7.0     # tab titles / main text vs toolbar
# pywalfox_icon_contrast = 3.5     # mid accents / icons
# pywalfox_control_contrast = 3.5

# CDE palette (see theme/cde.py)
# cde_restart_dtwm = true          # soft-restart dtwm after palette write

perceptual_hash_threshold = 14
hash_size = 8
hash_consensus_slack = 4
fetch_max_attempts = 5

# Theme-op runner limits (per operation)
operation_timeout = 30
wallust_timeout = 10
openrgb_timeout = 5
max_retries = 3
retry_delay = 1.0
