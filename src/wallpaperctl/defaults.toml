# Default operation settings (override in ~/.config/wallpaperctl/ops.toml)

operations_enabled = true
continue_on_error = true
debug_operations = false

[enable]
wallust = true
xresources = true
gtk_theme = true
notifications = true
openrgb = true
openlinkhub = true
emacs = true
window_manager = true
nwg_look = true
cinnamon_theme = true
dynamic_icons = false
homeassistant = true
steam_theme = false
cosmic_theme = true
cde_theme = true
pywalfox = true

[wallust]
# mapped via flat keys below for simplicity — use top-level too

[ops]
wallust_backend = "wal"
wallust_palette = "kmeans"
gtk_theme_plasma = "Breeze"
gtk_theme_xfce = "FlatColor-dark"
gtk_theme_cinnamon = "Mint-Y"
gtk_theme_standalone = "FlatColor-dark"
dynamic_icon_theme_name = "wallust-dynamic-icons"
rgb_color_strategy = "warmest"
openrgb_color_line_plasma = 3
openrgb_color_line_standalone = 5
# OpenLinkHub local REST (soft-skip if daemon not running)
openlinkhub_url = "http://127.0.0.1:27003"
openlinkhub_timeout = 5.0
openlinkhub_brightness = 1.0
emacs_theme = "ewal-doom-one"
wallpaper_scaling_cinnamon = "scaled"
wallpaper_scaling_gnome = "scaled"
wallpaper_dir = "~/Wallpapers"

# COSMIC theming (see theme/cosmic.py)
# cosmic_theme_mode = "surfaces"   # accent | surfaces | full
# cosmic_accent_strategy = "warmest"
# cosmic_accent_softness = 0.42    # mix accent toward wallpaper bg
# cosmic_accent_desaturate = 0.22

# Pywalfox (Firefox) — boost colors.json contrast then pywalfox update
# pywalfox_improve_contrast = true
# pywalfox_text_contrast = 7.0     # tab titles / main text vs toolbar
# pywalfox_icon_contrast = 3.5     # mid accents / icons
# pywalfox_control_contrast = 3.5

# CDE palette (see theme/cde.py)
# cde_restart_dtwm = true          # soft-restart dtwm after palette write

perceptual_hash_threshold = 14
hash_size = 8
hash_consensus_slack = 4
fetch_max_attempts = 5

# Theme-op runner limits (per operation)
operation_timeout = 30
wallust_timeout = 10
openrgb_timeout = 5
max_retries = 3
retry_delay = 1.0
